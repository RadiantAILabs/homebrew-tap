name: Homebrew formula
run-name: Homebrew ${{ inputs.release_tag || 'current' }}

on:
  push:
    branches: [main]
    paths:
      - Formula/**
      - scripts/**
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - Formula/**
      - scripts/**
      - .github/workflows/tests.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable application release tag to publish (empty tests the current formula)
        type: string
        default: ""
      force_rebuild:
        description: Republish a release whose formula is already current
        type: boolean
        default: false

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORMULA: radiantailabs/tap/polaris-code
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests
      - name: Verify the formula's release archives
        run: python3 scripts/release_formula.py --check Formula/polaris-code.rb

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tap_commit: ${{ steps.baseline.outputs.tap_commit }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued release must compare against the last published formula.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - name: Record tap baseline
        id: baseline
        run: echo "tap_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.release_tag != ''
        with:
          python-version: "3.12"
      - name: Fetch and verify the release formula
        id: release
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild && 'true' || 'false' }}
        run: python3 scripts/release_formula.py Formula/polaris-code.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.publish == 'true'
        with:
          name: formula
          path: Formula/polaris-code.rb
          if-no-files-found: error
          retention-days: 7

  install:
    if: inputs.release_tag == '' || needs.prepare.outputs.publish == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tap_commit }}
      - uses: Homebrew/actions/setup-homebrew@ae72030040bc05e2d65c41c577092cb98bc0a27e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: formula
          path: ${{ runner.temp }}/formula
      - name: Install and test the formula
        shell: bash
        run: |
          formula_file="$(brew --repository radiantailabs/tap)/Formula/polaris-code.rb"
          if [[ -f "$RUNNER_TEMP/formula/polaris-code.rb" ]]; then
            cp "$RUNNER_TEMP/formula/polaris-code.rb" "$formula_file"
          fi
          brew trust --formula "$FORMULA"
          brew install "$FORMULA"
          brew test "$FORMULA"
          brew linkage --test "$FORMULA"

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tap_commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: ${{ runner.temp }}/formula
      - name: Confirm tap baseline is still current
        env:
          TAP_COMMIT: ${{ needs.prepare.outputs.tap_commit }}
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$TAP_COMMIT" ]]; then
            echo "Tap changed during this run; re-run all jobs from the latest main." >&2
            exit 1
          fi
      - name: Publish the release formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cp "$RUNNER_TEMP/formula/polaris-code.rb" Formula/polaris-code.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/polaris-code.rb
          if git diff --cached --quiet; then
            echo "Formula for ${VERSION} is already published."
            exit 0
          fi
          git commit -m "Publish polaris-code ${VERSION}."
          git push origin HEAD:main
